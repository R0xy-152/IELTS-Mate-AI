[project]
name = "ielts-mate-ai"
version = "0.1.0"
description = "FastAPI IELTS vocabulary demo with resilient lookup and AI image generation."
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.128.8",
    "google-generativeai==0.8.6",
    "python-dotenv==1.2.1",
    "python-multipart==0.0.20",
    "requests==2.32.5",
    "SQLAlchemy==2.0.49",
    "uvicorn==0.39.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
]
